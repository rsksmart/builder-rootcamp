[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.5.0/",
    "forge-std/=dependencies/forge-std-1.11.0/src/",
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
wrap_comments = true

[rpc_endpoints]
default = "${RPC_URL}"

[dependencies]
forge-std = "1.11.0"
"@openzeppelin-contracts" = "5.5.0"
"@openzeppelin-contracts-upgradeable" = "5.5.0"

[soldeer]
remappings_generate = true
remappings_regenerate = false
remappings_location = "txt"


