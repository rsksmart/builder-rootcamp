# =============================================================================
# RSKj Regtest Configuration
# =============================================================================
# Use this configuration for local development and testing.
# Place at /etc/rsk/node.conf or specify with -Drsk.conf.file=path
# =============================================================================

# Network selection
blockchain.config.name = "regtest"

# Database configuration
database {
    dir = "/var/lib/rsk/regtest/database"
    reset = false
}

# RPC Configuration - Open for development
rpc {
    providers.web {
        http {
            enabled = true
            bind_address = "0.0.0.0"
            port = 4444
            hosts = ["*"]
        }
        ws {
            enabled = true
            bind_address = "0.0.0.0"
            port = 4445
        }
        cors = "*"
    }
    
    # Enable all modules for development
    modules {
        eth {
            enabled = true
        }
        net {
            enabled = true
        }
        web3 {
            enabled = true
        }
        personal {
            enabled = true
        }
        evm {
            enabled = true
        }
        txpool {
            enabled = true
        }
        debug {
            enabled = true
        }
        trace {
            enabled = true
        }
        rsk {
            enabled = true
        }
    }
}

# Mining configuration for automatic block production
miner {
    server.enabled = true
    client {
        enabled = true
        delayBetweenBlocks = 1 second
    }
    # This secret determines the coinbase address
    coinbase.secret = "bootcamp_miner_secret"
}

# Wallet configuration
wallet {
    enabled = true
    accounts = []
}

# Peer configuration (disabled for local-only)
peer {
    discovery.enabled = false
    port = 50501
    networkId = 7771
}

# Genesis configuration
genesis = "rsk-dev.json"
