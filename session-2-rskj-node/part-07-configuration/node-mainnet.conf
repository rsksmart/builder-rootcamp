# =============================================================================
# RSKj Mainnet Configuration
# =============================================================================
# Production configuration for running a mainnet node.
# Customize based on your security requirements.
# =============================================================================

# Network selection
blockchain.config.name = "main"

# Database configuration
database {
    dir = "/var/lib/rsk/mainnet/database"
    reset = false
    
    # Enable fast sync (recommended for new nodes)
    import {
        enabled = false  # Set to true for initial sync
        # url = "https://..."  # Official import URL
    }
}

# RPC Configuration - Secure for production
rpc {
    providers.web {
        http {
            enabled = true
            bind_address = "127.0.0.1"  # Only localhost
            port = 4444
            hosts = ["localhost", "127.0.0.1"]
        }
        ws {
            enabled = false  # Disable if not needed
        }
        cors = ""  # Disable CORS
    }
    
    # Production module configuration
    modules {
        eth {
            enabled = true
        }
        net {
            enabled = true
        }
        web3 {
            enabled = true
        }
        personal {
            enabled = false  # Disable for security
        }
        evm {
            enabled = false  # Not available on mainnet
        }
        txpool {
            enabled = true
        }
        debug {
            enabled = false  # Disable for performance
        }
        trace {
            enabled = false  # Disable for performance
        }
        rsk {
            enabled = true
            methods {
                disabled = ["rsk_shutdown", "rsk_flush"]
            }
        }
    }
}

# Mining disabled (not a miner node)
miner {
    server.enabled = false
    client.enabled = false
}

# Wallet disabled for security
wallet {
    enabled = false
}

# Peer configuration
peer {
    discovery.enabled = true
    port = 5050
    networkId = 775
    maxActivePeers = 30
}

# Sync configuration
sync {
    enabled = true
    peer.count = 10
}
